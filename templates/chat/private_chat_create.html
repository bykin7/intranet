{% extends "core/base.html" %}
{% block title %}HappyTogether — Новый личный чат{% endblock %}

{% block content %}
<div class="page-header-unified">
  <div class="page-header-main">
    <h1 class="page-title">Новый личный чат</h1>
    <div class="page-subtitle">Выберите сотрудника для переписки</div>
  </div>

  <div class="page-header-actions">
    <a class="btn btn-light pill btn-sm" href="{% url 'chat_home' %}">
      ← Назад
    </a>
  </div>
</div>

<div class="card card-soft">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Сотрудник</label>
        {{ form.user }}
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-success pill" type="submit">Создать чат</button>
        <a class="btn btn-outline-secondary pill" href="{% url 'chat_home' %}">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
