{% extends "core/base.html" %}
{% block title %}HappyTogether — Удаление участника{% endblock %}

{% block content %}
<div class="page-header-unified">
  <div class="page-header-main">
    <h1 class="page-title">Удаление участника</h1>
    <div class="page-subtitle">Группа: {{ group.name }}</div>
  </div>

  <div class="page-header-actions">
    <a href="{% url 'group_chat_detail' group.id %}" class="btn btn-light pill btn-sm">
      ← Назад
    </a>
  </div>
</div>

<div class="card card-soft">
  <div class="card-body">
    <p class="mb-3">
      Удалить участника <strong>{{ membership.user.profile.full_name|default:"Без ФИО" }}</strong> из группы?
    </p>

    <form method="post" class="d-flex gap-2">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger pill">Удалить</button>
      <a href="{% url 'group_chat_detail' group.id %}" class="btn btn-outline-secondary pill">Отмена</a>
    </form>
  </div>
</div>
{% endblock %}
