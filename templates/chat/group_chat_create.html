{% extends "core/base.html" %}
{% block title %}HappyTogether — Новая группа{% endblock %}

{% block content %}
<div class="page-header-unified">
  <div class="page-header-main">
    <h1 class="page-title">Новая группа</h1>
    <div class="page-subtitle">Создание группового чата</div>
  </div>

  <div class="page-header-actions">
    <a class="btn btn-light pill btn-sm" href="{% url 'chat_home' %}">
      ← Назад
    </a>
  </div>
</div>

<div class="card card-soft">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Название</label>
        {{ form.name }}
      </div>

      <div class="mb-3">
        <label class="form-label">Описание</label>
        {{ form.description }}
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-success pill" type="submit">Создать группу</button>
        <a class="btn btn-outline-secondary pill" href="{% url 'chat_home' %}">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
