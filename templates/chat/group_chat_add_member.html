{% extends "core/base.html" %}
{% block title %}HappyTogether — Добавить участника{% endblock %}

{% block content %}
<div class="page-header-unified">
  <div class="page-header-main">
    <h1 class="page-title">Добавить участника</h1>
    <div class="page-subtitle">Группа: {{ group.name }}</div>
  </div>

  <div class="page-header-actions">
    <a href="{% url 'group_chat_detail' group.id %}" class="btn btn-light pill btn-sm">
      ← Назад
    </a>
  </div>
</div>

<div class="card card-soft">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Сотрудник</label>
        {{ form.user }}
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-success pill" type="submit">Добавить</button>
        <a href="{% url 'group_chat_detail' group.id %}" class="btn btn-outline-secondary pill">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
