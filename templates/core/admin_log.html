{% extends "core/base.html" %}
{% block title %}HappyTogether — Журнал действий{% endblock %}

{% block content %}
<div class="page-header-unified">
  <div class="page-header-main">
    <h1 class="page-title">Журнал действий</h1>
    <div class="page-subtitle">Последние события системы</div>
  </div>

  <div class="page-header-actions">
    <a href="/" class="btn btn-light pill btn-sm">← Назад</a>
  </div>
</div>

<div class="card card-soft">
  <div class="card-body">
    {% for line in lines %}
      <div class="small border-bottom py-2">{{ line }}</div>
    {% empty %}
      <div class="muted">Нет записей</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
