{% extends "core/base.html" %}
{% block title %}HappyTogether — Редактирование поста{% endblock %}

{% block content %}
<div class="page-header-unified">
  <div class="page-header-main">
    <h1 class="page-title">Редактирование поста</h1>
    <div class="page-subtitle">Изменение публикации</div>
  </div>

  <div class="page-header-actions">
    <a class="btn btn-light pill btn-sm" href="{% url 'post_detail' post.id %}">
      ← Назад
    </a>
  </div>
</div>

<div class="card card-soft">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Заголовок</label>
        {{ form.title }}
      </div>

      <div class="mb-3">
        <label class="form-label">Текст</label>
        {{ form.body }}
      </div>

      <div class="form-check mb-3">
        {{ form.is_pinned }}
        <label class="form-check-label">📌 Важное</label>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-success pill" type="submit">Сохранить</button>
        <a class="btn btn-outline-secondary pill" href="{% url 'post_detail' post.id %}">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
