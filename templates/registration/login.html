{% extends "core/base.html" %}
{% block title %}HappyTogether — Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">

    <div class="page-header-unified">
      <div class="page-header-main">
        <h1 class="page-title">Вход</h1>
        <div class="page-subtitle">Авторизация в системе</div>
      </div>
    </div>

    <div class="card card-soft">
      <div class="card-body p-4">

        {% if form.errors %}
          <div class="alert alert-danger">
            Неверный логин или пароль.
          </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Логин</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>

          <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" name="password" class="form-control" required>
          </div>

          <button class="btn btn-primary pill w-100" type="submit">Войти</button>
        </form>

        <div class="muted small mt-3 text-center">
          Доступ выдается администратором
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
